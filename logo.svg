<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Solar PAYG Mauritanie">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B3A"/><stop offset="1" stop-color="#0A3B35"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/><stop offset=".5" stop-color="#10B981"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <clipPath id="clip"><rect x="4" y="4" width="112" height="112" rx="28"/></clipPath>
  </defs>
  <!-- fond + anneau tricolore -->
  <rect x="2" y="2" width="116" height="116" rx="30" fill="url(#ring)"/>
  <rect x="5" y="5" width="110" height="110" rx="27" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <!-- halo du soleil -->
    <circle cx="60" cy="58" r="40" fill="#F59E0B" opacity=".12"/>
    <circle cx="60" cy="58" r="30" fill="#F59E0B" opacity=".14"/>
    <!-- rayons -->
    <g stroke="#FBBF24" stroke-width="3.2" stroke-linecap="round">
      <line x1="60" y1="20" x2="60" y2="27"/>
      <line x1="33" y1="31" x2="38" y2="36"/><line x1="87" y1="31" x2="82" y2="36"/>
      <line x1="22" y1="55" x2="29" y2="55"/><line x1="98" y1="55" x2="91" y2="55"/>
    </g>
    <!-- soleil -->
    <circle cx="60" cy="55" r="19" fill="url(#sun)"/>
    <!-- toque de diplômé (projet de fin d'études) -->
    <g>
      <polygon points="60,20 82,29 60,38 38,29" fill="#F8FAFC"/>
      <polygon points="60,20 82,29 60,38 38,29" fill="none" stroke="#0B1B3A" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M48 33.5 V41 Q60 47 72 41 V33.5 L60 38.5 Z" fill="#CBD5E1" stroke="#0B1B3A" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M82 29 V42" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <circle cx="82" cy="44" r="2.6" fill="#F59E0B"/>
    </g>
    <!-- panneau solaire -->
    <polygon points="22,96 98,96 88,66 32,66" fill="#CBD5E1"/>
    <polygon points="25.5,93 94.5,93 86,69 34,69" fill="url(#panel)"/>
    <g stroke="#93C5FD" stroke-width="1.3" opacity=".85">
      <line x1="30.2" y1="81" x2="89.8" y2="81"/>
      <line x1="48" y1="69" x2="43" y2="93"/><line x1="60" y1="69" x2="60" y2="93"/><line x1="72" y1="69" x2="77" y2="93"/>
    </g>
    <polygon points="34,69 60,69 52,81 30.2,81" fill="#fff" opacity=".12"/>
    <!-- pied -->
    <rect x="54" y="96" width="12" height="8" fill="#94A3B8"/>
  </g>
  <!-- paiement mobile : ondes -->
  <g fill="none" stroke="#34D399" stroke-width="3.4" stroke-linecap="round">
    <path d="M96 22 a12 12 0 0 1 0 16" opacity=".95"/>
    <path d="M103 17 a20 20 0 0 1 0 26" opacity=".6"/>
  </g>
  <circle cx="91" cy="30" r="3" fill="#34D399"/>
</svg>
