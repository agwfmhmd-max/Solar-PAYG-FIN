<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Solar PAYG Mauritanie">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E2347"/><stop offset="1" stop-color="#06201E"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset=".55" stop-color="#10B981"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEF08A"/><stop offset=".55" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="pan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <clipPath id="disc"><circle cx="60" cy="60" r="27"/></clipPath>
  </defs>
  <!-- médaillon -->
  <circle cx="60" cy="60" r="58" fill="url(#rim)"/>
  <circle cx="60" cy="60" r="55" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <!-- rayons -->
  <g stroke="#FBBF24" stroke-width="3.4" stroke-linecap="round"><line x1="29.0" y1="48.7" x2="23.8" y2="46.8"/><line x1="38.8" y1="34.7" x2="35.3" y2="30.5"/><line x1="54.3" y1="27.5" x2="53.3" y2="22.1"/><line x1="71.3" y1="29.0" x2="73.2" y2="23.8"/><line x1="85.3" y1="38.8" x2="89.5" y2="35.3"/><line x1="92.5" y1="54.3" x2="97.9" y2="53.3"/></g>
  <!-- disque soleil / panneau -->
  <g clip-path="url(#disc)">
    <rect x="30" y="30" width="60" height="31" fill="url(#sun)"/>
    <rect x="30" y="64" width="60" height="30" fill="url(#pan)"/>
    <g stroke="#BFDBFE" stroke-width="1.2" stroke-opacity=".9">
      <line x1="30" y1="73.5" x2="90" y2="73.5"/><line x1="30" y1="83" x2="90" y2="83"/>
      <line x1="60" y1="64" x2="60" y2="94"/><line x1="47" y1="64" x2="42" y2="94"/><line x1="73" y1="64" x2="78" y2="94"/>
    </g>
    <path d="M30 64 H90 V67 H30Z" fill="#fff" fill-opacity=".18"/>
  </g>
  <circle cx="60" cy="60" r="27" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.6"/>
  <!-- boucle de paiement récurrent (PAYG) -->
  <g fill="none" stroke="url(#arc)" stroke-width="5" stroke-linecap="round">
    <path d="M52.01 14.70 A46 46 0 0 1 83.00 99.84"/><path d="M67.99 105.30 A46 46 0 0 1 37.00 20.16"/>
  </g>
  <g fill="#22D3EE" stroke="#22D3EE" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="78.96,92.84 73.80,105.15 87.04,106.83"/><polygon points="41.04,27.16 46.20,14.85 32.96,13.17" fill="#34D399" stroke="#34D399"/>
  </g>
</svg>
